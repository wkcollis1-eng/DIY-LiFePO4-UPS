# ============================================================================
# Top-Off Charger V0.5 — DRAFT, COMPILE-VALIDATED, NOT BENCH-TESTED
#   Unvalidated until 2026-10-22 (owner's call, 2026-10-16: "no validation at
#   this point"). On 2026-10-22 the owner asked for it, and V0.4 passed the
#   esp-firmware-validation gate (design §9) on ESPHome 2026.10.0, the add-on's
#   version: config valid, real compile, main.cpp.obj 0 errors. It is still NOT
#   flash-ready: T1–T16 (design §11) have not been run.
#   Spec: ../top-off-charger-design.md rev 0.13, §9: FW-1, FW-3 to FW-14.
#   Source-level read against ESPHome 2026.9.1 (ina2xx_base, ina2xx_i2c,
#   globals, preferences, esp32 gpio, ota). The Device Builder add-on's ESPHome
#   version governs; re-read those components on it before the gate (O4).
#   V0.4's additions were read at 2026.10.0, the add-on's version (debug,
#   uptime, i2c, ina2xx_base, ina2xx_i2c, globals). V0.5's at 2026.10.1, the
#   add-on's version (globals, esp32 preferences, core/time, time, text_sensor,
#   debug, wifi_signal, internal_temperature).
# ============================================================================
# Purpose : Supervisor for the bench top-balance HOLD of the UPS's Cyclenbatt
#           12 V 10 Ah pack, after a full charge on the Dylannet P20 (§4.3).
#           The HDR-30-15, trimmed to 14.40 V (FW-7, T0), does all the
#           regulating. This firmware only opens and closes the path through
#           the Pololu #2814, times the hold, enforces the hard stops,
#           publishes the session, and drives the status LED.
#
# Hardware: Top Off Charger PCB rev 0.8 (design §7).
#   U1 XIAO ESP32-C3. U2 Adafruit INA228 #5832, onboard 15 mΩ shunt KEPT,
#   VBUS jumper CLOSED (high-side), I2C 0x40. U4 Pololu #2814, slide LOCKED
#   OFF (§7.2). U5 #5382 ideal diode (holds I >= 0 through the shunt). U3
#   D24V7F3 fed from BATT_RAW, upstream of the switch (board alive whenever AC
#   is on, dark when it is off).
#     D1 GPIO3 -> R1 1 kΩ -> status LED, active-high ................ FW-11
#     D2 GPIO4 -> #2814 ON, direct. NO pull-up anywhere: the #2814's own
#                 R4 + R5 (20 kΩ to GND) hold it OFF through every reset .. FW-1
#     D4 GPIO6 / D5 GPIO7 -> INA228 SDA / SCL
#
# Flashing: first flash by USB with AC OFF (cord out of the countdown timer),
#   OTA after that, NEVER USB with AC on: U3's 3.3 V sits straight on the
#   XIAO's 3V3 pin (§5.4). logger baud_rate 0 for the same reason.
#
# ---------------------------------------------------------------------------
# HOW A TICK WORKS (read this before changing the interval blocks)
# ---------------------------------------------------------------------------
# Two facts from the ESPHome 2026.9.1 INA2xx driver shape everything [M, source
# read 2026-10-16, components/ina2xx_base/ina2xx_base.cpp]:
#   (a) update() only arms a read (lines 81-88). The read itself runs in
#       loop(), one register per loop pass: shunt, bus, die temp, current,
#       power, energy, charge, then status (lines 90-190). So nothing is read
#       when update() returns.
#   (b) A failed read publishes 0, not NaN (e.g. lines 109-113: the value
#       starts at 0 and is published whether or not the read succeeded). The
#       failure shows only as the component's warning flag, set at the end of
#       the cycle (lines 176-181). NaN appears only before the first cycle, or
#       if the chip failed at setup (then no cycle ever runs).
# So the INA228 has update_interval: never, and ONE 500 ms interval (the
# control tick) does, in this order:
#   1. consume the cycle it armed on the previous tick: fresh only if that
#      cycle reached its last publish (charge on_value sets cyc_seen), the
#      warning flag is clear, the component is not failed, and V, I are not
#      NaN. One stale or failed cycle = FAULT "sensor" (FW-4, N = 1).
#   2. run the state machine on that one (V, I) pair;
#   3. arm the next cycle.
# Margin: a cycle takes ~8 loop passes, ~128 ms at ESPHome's default 16 ms
# loop interval [D: 8 x 16 ms; core/application.h:525], against 500 ms
# [I: slower under Wi-Fi/API load; falsifier: FAULT "sensor" in T4's silent
# direction, a full warm session].
# Ceiling latency, worst case: a crossing just after a read is read on the
# next tick's cycle and acted on one tick later: <= 500 + 128 + 500 - 128 =
# 1000 ms from the crossing, plus up to one bus window and one cycle for it to
# show in the result register (<= 67.3 + 202 ms) [D] -> <= ~1.27 s.
# FW-12 edge pairs: the "before" pair is the one consumed on the tick that
# moves the switch (it was read before the edge). The "after" pair is consumed
# two ticks later: its cycle was armed one tick (500 ms) after the edge, and
# any INA228 result read >= 270 ms after an edge comes only from conversions
# that started after it [D: the latest bus result ended <= 202 ms before the
# read, and its 67.3 ms window began <= 269.3 ms before the read].
#
# ---------------------------------------------------------------------------
# LED (FW-11, rev 0.9). On/off only; R1 sets ~1.2 mA and its brightness is
# unverified (§5.5), so no PWM dimming.
#   dark ............ no AC, or firmware not running (dark > ~10 s, §5.4)
#   Waiting ......... on, 100 ms wink every 3 s IDLE, Start would be refused
#   Ready to charge . 1 s on, 2 s off           IDLE, FW-3 met: press Start
#   Charging ........ 500 ms on / 500 ms off    switch ON
#   Final minute .... 150 on,150 off,150 on, 550 off (1 s)
#                     switch ON, T_hold - time-at-voltage <= final_lead_s
#   Done ............ on, two 100 ms winks every 3 s (latched)
#   Fault ........... 4 Hz, 125/125 ms (latched; every reason, incl. FW-13)
# Precedence: Fault > Done > Final minute > Charging > Ready > Waiting.
# V0.5 (owner, 2026-10-30: "turn on the esp32 led when powered for a sign of
# life"): Waiting and Done were 3.3 % and 6.7 % on [D: 100/3000, 200/3000], so a
# healthy idle board read as dead. Inverted, they are 96.7 % and 93.3 % on [D].
# This LED is the only one firmware can drive: the XIAO ESP32-C3 has no user
# LED, only CHG-LED [S: Seeed wiki, XIAO_ESP32C3_Getting_Started, pin map].
# Every powered state moves, so a STEADY LED means a hung CPU (L3 then resets
# it, and the LED goes dark). The renderer only displays the tick's state.
# Its one other job: if the tick stops running for > 2 s while the loop is
# alive, it turns the switch OFF and shows Fault (the L3 gap, "logic error
# that keeps the loop alive", §8). OFF is the only action it may take.
#
# ---------------------------------------------------------------------------
# TAIL FLOOR (FW-14, rev 0.10): OBSERVATION ONLY. Nothing in tick steps 1-7's
# decisions reads these values, so they cannot end, extend or start a session.
#   settle ...... the first tail_settle_s of TIME AT VOLTAGE (not of the session)
#   window ...... tail_window_s blocks of valid at-voltage ticks; each block's
#                 mean is one "Tail Window Mean". V0.5: ticks enter in whole
#                 credited blocks (BMS OPEN, below), so a low block's ticks are
#                 in no window
#   floor ....... the lowest window mean after settle. A minimum of means, not
#                 of samples: one sample is one noise draw (20.8 µA ADC step),
#                 so a sample minimum is biased low. No "non-zero" test: exact 0
#                 is a failed read, and those ticks are already invalid.
#   charge after settle .. CHARGE register at the end minus at settle: the most
#                 the balancer could have moved this session (it also holds the
#                 BMS's own draw and self-discharge)
#   idle offset . EWMA (~60 s) of the current in IDLE with the switch settled
#                 OFF, where the true current is 0 (FW-13's argument). Published,
#                 snapshotted at Start, and subtracted DOWNSTREAM, not here.
# A "balancer activity" flag is deliberately absent: the floor is bleed + BMS
# draw + self-discharge on a sealed pack, and the residual only shows across
# sessions. Define the flag after T11 (design FW-14).
#
# ---------------------------------------------------------------------------
# BMS OPEN (FW-5, O18, rev 0.13). A BMS that opens at the tail leaves nothing
# one tick can see: S5's last hour had sd 0.109 mA and min -0.134 mA against an
# idle -0.100 mA [M, HA rows, n=3406], so single tail samples reach the open
# level. Every valid CHARGING tick, at ANY voltage, feeds a bms_block_s block of
#     i_net = I - the idle offset snapshotted at Start
# and the test is on the block's mean:
#   low ........ mean < bms_i_open, AND one of the last two non-low means is
#                >= twice bms_i_open. The second half is FW-3's "a balanced pack
#                legitimately decays toward 0": a tail that decays there is
#                credited, and an open from there is not seen. No such tail has
#                been measured; S5's lowest 10 s block was 0.129 mA at one block
#                phase [M, n=1299] and 0.079 mA at another [M, replay, +5.64 h]:
#                near-zero samples among 0.25-0.46 mA, longest run 2 s, no open.
#   BMS trip ... low, and one of those means >= bms_i_from: ends the session at
#                the first low block, <= 19.5 s after the cut [D: 39 ticks],
#                before the ~30 s reconnect [M, n=2].
#   tail cut ... low, below bms_i_from. The block earns no time at voltage and
#                enters no tail window. Two in a row are one cut: counted, its
#                pair kept. One alone may be noise, and costs 10 s of credit:
#                the safe direction. bms_open_max_s of them in a row end the
#                session in FAULT "BMS open".
# Time at voltage therefore moves in bms_block_s steps, DONE lands up to that
# much late, and a partial last block is never credited. prev_v/prev_i hold the
# last sample with i_net >= twice bms_i_open: the step can be 19.5 s old by the
# time it is detected, and no open sample came near that [M: corrected max
# 0.0414 mA, n=21 samples, one event].
#
# ---------------------------------------------------------------------------
# PLACEHOLDERS: every value marked PLACEHOLDER below is TBD from T11 (O5) or
# T0/T15 (FW-13). T11 is a SUPERVISED session. Do not run unattended on them.
#
# Changelog:
#   V0.1 — 2026-10-16. First draft from design rev 0.9. Not validated.
#          Same day: T11 start values T_hold 6 h, T_max 8 h (owner), up from
#          1 h / 2 h placeholders. Counters are uint32 ms, so they are good to
#          ~49.7 days [D: 2^32 ms / 86.4e6 ms per day]; 8 h = 28.8e6 ms.
#   V0.2 — 2026-10-16. FW-14 tail-floor observation (design rev 0.10): window
#          means, floor, charge after settle, idle offset, all in the session
#          record. Report-only. Not validated.
#   V0.3 — 2026-10-22. Stop beats Start: a Stop on the same tick as a Start
#          cancels it (V0.2 started the session and dropped the Stop). The
#          HA controls stay three separate buttons (owner). Not validated.
#   V0.4 — 2026-10-22. Robustness review #1, #2, #6 (owner; #4 web_server auth
#          not built). #1: a reset that cuts a session (AC loss, L6 timer,
#          watchdog, crash) boots to FAULT "reset during a session", and the
#          record says so instead of keeping the previous session's. #2: the
#          INA228's ADC_CONFIG and SHUNT_CAL are read back every tick and the
#          CHARGE register must not fall while charging, so an INA228 that
#          resets alone latches FAULT "INA228 reset". #6: ESP reset reason and
#          uptime published. Design rev 0.11. Not validated.
#          Then validated, same day (owner): the four INA228 sub-sensors got the
#          name: that `esphome config` had rejected them without since V0.1
#          (R13 note at the INA228 block). Compiles on 2026.10.0: main.cpp.obj
#          0 errors, 0 warnings; a planted lambda fault failed the same build.
#   V0.5 — 2026-10-30. Owner's six changes, design rev 0.13. Not validated by
#          T1-T16. (1) Start gate v_start_max 14.40, separate from V_hold: Ack
#          07:01:01 and Start 07:01:09 EDT on 10-30 were refused at a 14.354 V
#          rest [M]. The gate does NOT raise the charge voltage: the PSU trimpot
#          sets that. V_hold is now 14.38, the threshold time at voltage counts
#          above: S5 held 14.4021-14.4035 [M, n=12103], so a count at 14.40 had
#          2.1 mV of margin [D]. (2) T_hold 8 h, T_max 10 h. (3) What survives
#          an unplug: the edge pairs, the end time, BMS cuts, a lifetime session
#          count, and a 10-min checkpoint of the record, so a cut session keeps
#          its last figures. The boot re-seeds the Session card from the record.
#          (4) Node health: RSSI, heap, loop time, CPU temperature, firmware
#          version, IP, connectivity, flash flush time. (5) O18: BMS OPEN, above.
#          New end reason "BMS open". (6) LED on when powered (LED, above).
#          R13: the CHARGE guard's "only rises" ignored the INA228's offset, so
#          a healthy small session could end in FAULT "INA228 reset" (step 7).
#          Found by the V0.5 replay, never seen on the device.
# ============================================================================

substitutions:
  device_name: top-off-charger
  friendly_name: Top-Off Charger
  device_description: "LiFePO4 top-balance hold supervisor (UPS Cyclenbatt 10 Ah) - V0.5 DRAFT"

  # Float substitutions are pasted into C++ as ${x}f, so each needs a decimal
  # point ("10.0", not "10"), or "10f" will not compile.
  # ---- Fixed by the design (rev 0.9 §3, §9)
  v_ceiling: "14.60"     # FW-4: raw VBUS ceiling, one consumed sample
  v_start_min: "10.0"    # FW-3: VBUS must exceed this (Cyclenbatt BMS UVP); also the
                         #       charging floor below which VBUS means a failed read
                         #       (published as 0, header (b)) or a collapsed bus
  i_max: "5.0"           # FW-4 / RQ-1
  i_overload: "2.0"      # FW-4 / RQ-12: HDR-30-15 rated current [S, HDR-30-SPEC p.2]
  final_lead_s: "60"     # FW-11: final-minute cue lead time (owner, 2026-10-16)

  # ---- PLACEHOLDERS, set from T11 (O5). Integers here are seconds.
  v_start_max: "14.40"   # V0.5, FW-3 (owner, 2026-10-30): Start needs VBUS below this. Was
                         #   V_hold until the two jobs split: the pack rested at 14.354 V after
                         #   14 h [M] and Start was refused. Only 2.7 mV under VBUS at the
                         #   trimmed PSU [D: S5 mean 14.4027], so FW-13's current test, not
                         #   this gate, is what catches a shorted switch
  v_hold: "14.38"        # PLACEHOLDER. FW-6, was 14.30 and FW-3 too. Must sit below V_SET 14.40 V
                         #   by more than the tail-current drops, and above the pack's rest voltage
                         #   V0.5: 22.1 mV under S5's lowest hold reading 14.4021 [M, n=12103],
                         #   ~5.1 degC at the design's 4.32 mV/degC [D]; reached 6 s after Start
                         #   [M, n=1]. "Above rest" no longer holds and no longer matters: FW-3
                         #   has its own threshold, and a rest above this only starts the count
  t_hold_s: "28800"      # 8 h (owner, 2026-10-30): the tail shows no plateau [D: log-log slope
                         #   -0.80, -1.18, n=33 windows each], so this is a longer MEASUREMENT.
                         #   6 to 8 h moved 0.48-0.62 mAh, ~0.005 % of 10 Ah [D, extrapolated].
                         #   Was 21600:
                         #   6 h. T11 START VALUE (owner, 2026-10-16), FW-6 time at voltage.
                         #   Long enough to see whether a balancer floor exists and holds
                         #   (it should show within the first hour on a full pack), and to
                         #   do real balancing if it does: 6 h x 50 mA = 0.30 Ah = 3 % of
                         #   10 Ah [D; the bleed rate is an assumption until T11]. Size the
                         #   later sessions from T11's floor: hold time = imbalance / floor.
                         #   Still the owner's trade against the no-backup window (§10.2).
  t_max_s: "36000"       # 10 h (V0.5; 8 h until then). T11 START VALUE, FW-4 session cap: T_hold plus 2 h for the
                         #   pack to reach V_hold and margin. The L6 timer must be set above it
                         #   (§10.1 step 5), so it must reach > 10 h.
  t_ol_s: "300"          # PLACEHOLDER. FW-4 cumulative time with I > i_overload
  bms_i_from: "0.100"    # PLACEHOLDER. FW-5: "charging" before the step (A)
  # R13, 2026-10-30: V0.1-V0.4 had bms_i_zero 0.005 here (A, "~0" after the step)
  # and tested one tick against the tick before. Under 5 mA is every tail tick,
  # so it could not see a tail cut (O21), and S2's first cut went unseen with
  # V0.4 running [M]; the 1 Hz history does not show why [I: a sample in the odd
  # tick between 0.95 A and 0; R18]. Removed with the one-tick test (O18).
  bms_i_open: "0.00007"  # PLACEHOLDER. FW-5: a block mean below this is "no current" (A).
                         #   0.07 mA: open blocks reached +0.0185 mA [M, 4 blocks, 2 events];
                         #   the lowest tail block was 0.129 mA [M, S5 2-6 h, n=1299],
                         #   0.079 mA at another block phase [M, replay]: a thin margin,
                         #   and a lone low block costs 10 s of credit, not the session
  bms_block_s: "10"      # FW-5 block. 10 s puts at least one whole block inside a 28 s open
                         #   [D: needs >= 2 x block]. Must be a whole number of seconds
  bms_open_max_s: "120"  # PLACEHOLDER. FW-5: low blocks this long in a row end the session.
                         #   ~4 x the ~30 s the BMS has stayed open [M, n=2]
  # ---- FW-14 tail floor (report-only). Integers are seconds.
  tail_settle_s: "1800"  # PLACEHOLDER (T11): time at voltage before the floor counts.
                         #   T11 shows how long the absorption tail takes to flatten.
                         #   Must stay well under t_hold_s
  tail_window_s: "600"   # 10-min window means (1200 ticks at 2 Hz)
  ckpt_s: "600"          # V0.5, FW-9: record checkpoint while charging (1200 ticks at 2 Hz)
  # ---- PLACEHOLDER, set from T0's idle reading and T15 (FW-13)
  i_off_floor: "0.050"   # PLACEHOLDER. FW-13: current with the switch commanded OFF (A)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  project:
    name: "wkcollis1.top-off-charger"
    version: "0.5"
  on_boot:
    - priority: -200
      then:
        - logger.log:
            level: INFO
            format: "Top-Off Charger V0.5 DRAFT boot -- switch OFF (ALWAYS_OFF), INA228 @ 0x40"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0   # USB must NOT be connected with AC on (§5.4)

api:
  encryption:
    key: !secret api_key_top_off_charger
  # FW-8: termination and stops are local; HA is not in the loop. A reboot
  # mid-session is safe (FW-1) but loses the session. Recovery reboot is the
  # IDLE-only interval below.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password
    # A reflash resets the CPU, which opens the switch anyway (FW-1). This
    # ends a running session first so its record is written with an honest
    # end reason. The record reaches flash through the shutdown path
    # (globals on_shutdown store, then the preferences syncer's on_shutdown
    # sync) [I: shutdown order not traced; falsifier: T2's record after an
    # OTA mid-session reads "stopped: OTA update"].
    on_begin:
      - lambda: |-
          if (id(chg_state) == 1) {          // 1 = CHARGING
            id(charge_sw).turn_off();
            id(rec_reason) = 10;             // 10 = R_STOP_OTA
            id(rec_ah) = id(session_ah_live);
            id(rec_t_at_v_s) = id(t_at_v_ms) / 1000.0f;
            id(rec_elapsed_s) = (millis() - id(t_start_ms)) / 1000.0f;
            id(rec_bms_v) = id(cut_v);       // V0.5: the last cut's pair, NAN if none
            id(rec_bms_i) = id(cut_i);
            id(rec_cuts) = id(bms_cuts);
            id(rec_tail_floor) = id(tail_floor);       // FW-14
            id(rec_tail_last) = id(tail_last);
            id(rec_q_settle_ah) = std::isnan(id(q_at_settle)) ? NAN : (id(session_ah_live) - id(q_at_settle));
            id(rec_idle_off) = id(idle_off_start);
            const ESPTime t = id(ha_time).utcnow();    // V0.5; 0 = no clock
            id(rec_end_epoch) = t.is_valid() ? (uint32_t) t.timestamp : 0u;
            id(rec_edge_off_vb) = NAN;       // V0.5: this edge is not captured
            id(rec_edge_off_ib) = NAN;
            id(rec_edge_off_va) = NAN;
            id(rec_edge_off_ia) = NAN;
            id(sess_open) = false;           // V0.4. If the shutdown path never flushes,
                                             // flash still holds it set and the next boot
                                             // reads FAULT "reset during a session": the
                                             // [I] above fails loud, not silent
            id(chg_state) = 0;               // 0 = IDLE: state and switch agree
            ESP_LOGW("charger", "OTA begin: session stopped, record kept");
          }

wifi:
  # Where the TOOLING finds this device. The Device Builder add-on runs in a
  # container with no mDNS resolver, so top-off-charger.local never resolves
  # there; every node in H:/esphome carries this key for that reason.
  # 10.0.0.116 is the address HA's config entry for this MAC
  # (1c:db:d4:ec:e1:98) connects to [M: core.config_entries, 2026-10-28], and
  # the API answered there as top-off-charger [M, 2026-10-28]. It changes
  # nothing the device does: compiled in only as the "Address:" line of the
  # API, OTA and web server config dumps [M: generated api_server.cpp:373,
  # ota_esphome.cpp:137, web_server.cpp:433, ESPHome 2026.10.1]. Pair with a
  # DHCP reservation, or this goes stale when the lease moves.
  use_address: 10.0.0.116
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s   # FW-8, as api
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# §10.1 step 6 reads VBUS and presses Start "in HA or on the ESPHome web page".
web_server:
  port: 80

# Crash-loop recovery. Safe mode sets up only what OTA needs, so GPIO4 is never
# driven and the #2814's pull-down holds the switch OFF; GPIO3 is never driven,
# so the LED is dark (§5.4's "not running").
safe_mode:
  num_attempts: 10
  reboot_timeout: 5min

# V0.4 (#6): hub for the "Reset Reason" text sensor. It publishes the reason
# once, from dump_config at boot [M: debug_component.cpp:52-56, 2026.10.0].
# The session record does not copy it (R10): this entity owns the reason.
debug:

# V0.5, FW-9: the wall clock for "Last Session End Time", and nothing else. It
# comes from HA over the API and free-runs after that, so HA down at the end of
# a session still stamps it; never synced since boot stamps 0, which reads
# unknown. A float cannot hold an epoch: 128 s spacing at 1.7e9 [D: 2^7].
time:
  - platform: homeassistant
    id: ha_time

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: false
  id: bus_a
  frequency: 100kHz

# ---------------------------------------------------------------------------
# Charge enable (FW-1). Only the control tick turns it ON. It is internal: HA
# cannot switch it. Two other paths may only turn it OFF: OTA on_begin, and
# the LED renderer's tick watchdog.
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    id: charge_sw
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO4
      # 5 / 10 / 20 (default) / 40 mA [M: esp32/gpio.py, 2026.9.1]. ON needs
      # 0.17 mA [D: 3.3 V / 20 kΩ], so the weakest setting drives it fully.
      drive_strength: 5mA

output:
  - platform: gpio
    id: status_led
    pin: GPIO3   # D1, active-high through R1 (§5.5). Not a strapping pin.

globals:
  # ---- State machine. Volatile on purpose: a reboot always lands in IDLE with
  #      the switch OFF (RQ-4). The session RECORD is the restored set below.
  #      V0.4: except a reboot that cut a session (sess_open below), which lands
  #      in FAULT "reset during a session" (tick step 1b). The switch is OFF
  #      either way.
  - id: chg_state            # 0 IDLE, 1 CHARGING, 2 DONE (latched), 3 FAULT (latched)
    type: int
    restore_value: no
    initial_value: '0'
  - id: cur_reason           # reason for the current latch; codes in the tick lambda
    type: int
    restore_value: no
    initial_value: '0'
  - id: req_start            # set by buttons, consumed by the tick (FW-1)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: req_stop
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: req_ack
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ready_flag           # FW-3 met on this tick's pair (drives "Ready to charge")
    type: bool
    restore_value: no
    initial_value: 'false'

  # ---- INA228 cycle bookkeeping (header: HOW A TICK WORKS)
  - id: cyc_seen             # set by the charge sensor's on_value, the cycle's last publish
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cyc_primed           # a cycle has been armed at least once
    type: bool
    restore_value: no
    initial_value: 'false'

  # ---- Session timing
  - id: tick_n
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_tick_ms         # also the LED renderer's tick watchdog
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: t_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: t_at_v_ms            # FW-6 accumulator: time with VBUS >= V_hold, in credited blocks (V0.5)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: t_ol_ms              # FW-4 accumulator: time with I > i_overload (cumulative)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: prev_v               # FW-5: the last sample with current (V0.5; was the last sample)
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: prev_i
    type: float
    restore_value: no
    initial_value: 'NAN'
  # ---- V0.5, O18: the open block (header: BMS OPEN)
  - id: blk_sum              # sum of i_net, every valid CHARGING tick
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: blk_n
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: blk_t_at_v           # at-voltage ms, moved to t_at_v_ms only if the block is not low
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: blk_tail_sum         # at-voltage raw currents, moved to tail_sum on the same test
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: blk_tail_n
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: bms_ref_a            # the last two non-low block means. INFINITY at Start, so a
    type: float              # BMS already open at Start fires
    restore_value: no
    initial_value: 'INFINITY'
  - id: bms_ref_b
    type: float
    restore_value: no
    initial_value: 'INFINITY'
  - id: bms_low_n            # consecutive low blocks
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: bms_cuts             # cuts this session (header: BMS OPEN)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: cut_v                # the last cut's prev_v / prev_i; NAN if none
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: cut_i
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: session_ah_live      # INA228 CHARGE register, zeroed at Start (FW-9)
    type: float
    restore_value: no
    initial_value: '0.0f'
  - id: sess_ah_peak         # V0.4 (#2): highest CHARGE this session (tick step 7)
    type: float
    restore_value: no
    initial_value: '0.0f'

  # ---- FW-14 tail floor (report-only; no decision reads these)
  - id: tail_sum             # sum of at-voltage currents in the open window
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: tail_n
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: tail_floor           # lowest window mean after settle
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: tail_last            # last completed window mean
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: q_at_settle          # CHARGE register (Ah) when settle was reached
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: idle_off             # live idle-current EWMA (~60 s), switch settled OFF
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: idle_off_start       # idle_off snapshotted at Start
    type: float
    restore_value: no
    initial_value: 'NAN'

  # ---- FW-12 edge capture
  - id: on_edge_tick
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: off_edge_tick        # also FW-13's settle reference
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: on_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: off_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: on_vb
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: on_ib
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: off_vb
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: off_ib
    type: float
    restore_value: no
    initial_value: 'NAN'

  # ---- LED (FW-11): 0 Waiting, 1 Ready, 2 Charging, 3 Final minute, 4 Done, 5 Fault
  - id: led_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: led_t0               # pattern phase origin, reset on every mode change
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ---- Housekeeping
  - id: last_api_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sync_due_tick        # 0 = none pending
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ---- Session record (FW-9): written once when a session ends, then flushed
  #      to flash on purpose. Restoring globals copy their value to the
  #      preference cache on their own 1 s poll [M: globals_component.h:29,
  #      PollingComponent(1000)], and the cache reaches flash only every 60 s
  #      by default [M: preferences/__init__.py, flash_write_interval]. The
  #      L6 timer goes OFF right after DONE (§10.1 step 7), so without the
  #      tick's explicit sync the record could be lost.
  #      V0.5: also written every ckpt_s while charging, so a cut session keeps
  #      its last figures, and cleared at Start. A checkpoint changes ~8 values,
  #      each one NVS blob write; sync() skips the rest [M: esp32/preferences.cpp
  #      :232-233, is_changed_, 2026.10.1].
  - id: rec_reason
    type: int
    restore_value: yes
    initial_value: '0'
  - id: rec_ah
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_t_at_v_s
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_elapsed_s
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_bms_v            # FW-5 pre-step pair of the last cut (V0.5); NAN if none. Until V0.5: NAN unless the session ended in a BMS trip
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_bms_i
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_tail_floor       # FW-14; NAN if settle was never reached
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_tail_last
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_q_settle_ah
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_idle_off
    type: float
    restore_value: yes
    initial_value: 'NAN'
  # ---- V0.5: the rest of what an unplug used to lose. Keyed by name hash like
  #      sess_open below, so adding these moves nothing. Edge pairs are written
  #      when published (tick step 8).
  - id: rec_cuts             # BMS cuts in the session
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: rec_end_epoch        # UTC seconds; the last checkpoint's if the session was cut;
    type: uint32_t           # 0 = no clock
    restore_value: yes
    initial_value: '0'
  - id: rec_sessions         # lifetime count of Starts
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: rec_edge_on_vb
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_edge_on_ib
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_edge_on_va
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_edge_on_ia
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_edge_off_vb
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_edge_off_ib
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_edge_off_va
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: rec_edge_off_ia
    type: float
    restore_value: yes
    initial_value: 'NAN'
  # ---- V0.4 (#1): a session is open. Set and flushed at Start, cleared when
  #      end_session writes the record (or OTA on_begin). Set at boot means a
  #      reset cut the session before it could write its record. A restored
  #      global is keyed by its name's hash [M: globals_component.h:42,
  #      2026.10.0], so adding one moves no other global's stored value.
  #      Blind spot: a reset in the ~1.5 s between Start and the flush.
  - id: sess_open
    type: bool
    restore_value: yes
    initial_value: 'false'

sensor:
  # -------------------------------------------------------------------------
  # INA228: CORE. Internal and unfiltered: the tick reads .state, which is the
  # post-filter value, so a filter here would sit in the safety path. HA gets
  # the template copies below.
  # -------------------------------------------------------------------------
  - platform: ina2xx_i2c
    id: ina
    i2c_id: bus_a
    model: INA228
    address: 0x40
    shunt_resistance: 0.015 ohm
    # CURRENT_LSB = max_current / 2^19 = 10 / 524288 = 19.07 µA; SHUNT_CAL =
    # 13107.2e6 x 19.07e-6 x 0.015 = 3750, inside 15 bits [D: formulas from
    # ina2xx_base.cpp:355-356]. Range 0 spans ±163.84 mV / 0.015 Ω = ±10.92 A
    # [D], and the ADC's own step is 20.8 µA [D: 312.5 nV / 0.015 Ω].
    max_current: 10 A
    adc_range: 0
    # FW-10: 1052 µs x 64 = 67.3 ms per channel (> one 8.3 ms ripple period,
    # FW-8); bus + shunt + temp = 202 ms per cycle [D].
    adc_time: 1052us
    adc_averaging: 64
    reset_on_boot: true      # an INA228 reset ends the session anyway (FW-1)
    # R13, 2026-10-22: that comment is wrong when the INA228 resets ALONE (a VS
    # dropout at its socket, a transient) and the ESP runs on. Its registers
    # return to power-on defaults, CHARGE restarts at 0, and setup() is the
    # only writer of ADC_CONFIG and SHUNT_CAL [M: ina2xx_base.cpp:51-79,
    # 2026.10.0], so V0.1-V0.3 charged on with averaging and current scale
    # wrong and never knew. reset_on_boot resets the chip at the ESP's boot
    # only. V0.4 catches it: tick steps 1 and 7.
    update_interval: never   # armed by the control tick only
    # R13, 2026-10-22: V0.1-V0.4 gave these four no name:, and `esphome config`
    # failed on all four ("string value cannot be dictionary or list"). Each is
    # cv.maybe_simple_value(key=CONF_NAME), which reads a dict WITHOUT name: as
    # the name itself [M: ina2xx_base/__init__.py and config_validation.py, both
    # 2026.10.0 and 2026.8.2]. Found by the first config run. internal: true
    # keeps them out of HA; "Raw" keeps them distinct from the template copies.
    bus_voltage:
      name: "INA228 Bus Voltage Raw"
      id: vbus_raw
      internal: true
    current:
      name: "INA228 Current Raw"
      id: ibat_raw
      internal: true
    temperature:             # die temperature (FW-10)
      name: "INA228 Die Temperature Raw"
      id: die_t_raw
      internal: true
    charge:                  # Ah from the hardware CHARGE register (FW-9)
      name: "INA228 Charge Raw"
      id: hw_charge_ah
      internal: true
      on_value:
        - lambda: 'id(cyc_seen) = true;'   # last publish of the cycle

  # -------------------------------------------------------------------------
  # HA-facing copies (OBSERVABILITY). Published by the tick at 1 Hz, and NaN
  # when the tick's pair is not valid. Nothing reads these back.
  # -------------------------------------------------------------------------
  - platform: template
    id: vbus_ha
    name: "VBUS"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: ibat_ha
    name: "Charge Current"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: pbat_ha
    name: "Charge Power"       # signed V x I, not the INA228's unsigned POWER register
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    id: die_t_ha
    name: "INA228 Die Temperature"   # enclosure proxy, report-only (FW-10)
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: session_ah
    name: "Session Charge"
    unit_of_measurement: Ah
    state_class: measurement
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: t_at_v_ha
    name: "Time at Voltage"
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: t_remain_ha
    name: "Time Remaining at Voltage"
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: t_elapsed_ha
    name: "Session Elapsed"
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # ---- Session record, restored at boot (FW-9)
  - platform: template
    id: last_ah
    name: "Last Session Charge"
    unit_of_measurement: Ah
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: last_t_at_v
    name: "Last Session Time at Voltage"
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: last_elapsed
    name: "Last Session Elapsed"
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: last_cuts
    name: "Last Session BMS Cuts"    # V0.5 (O18)
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: bms_pre_v
    name: "BMS Trip Pre-Step VBUS"   # FW-5; the last cut's pair (V0.5), NaN if none. Until V0.5: NaN unless the last session ended in a trip
    unit_of_measurement: V
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: bms_pre_i
    name: "BMS Trip Pre-Step Current"
    unit_of_measurement: A
    accuracy_decimals: 4
    update_interval: never

  - platform: template
    id: bms_cuts_ha
    name: "BMS Cuts"                 # V0.5 (O18): this session, 0 at Start
    accuracy_decimals: 0
    update_interval: never

  # ---- FW-14 tail floor (report-only). Raw values: subtract the idle offset
  #      downstream, as V_batt and R_edge are computed downstream (§6.4).
  - platform: template
    id: tail_mean_ha
    name: "Tail Window Mean"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 5
    update_interval: never
  - platform: template
    id: tail_floor_ha
    name: "Tail Floor"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 5
    update_interval: never
  - platform: template
    id: q_settle_ha
    name: "Charge After Settle"
    unit_of_measurement: Ah
    state_class: measurement
    accuracy_decimals: 5
    update_interval: never
  - platform: template
    id: idle_off_ha
    name: "Idle Current Offset"       # live, in IDLE, every 10 s
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 5
    update_interval: never
  - platform: template
    id: sess_idle_off_ha
    name: "Session Idle Offset"       # the offset snapshotted at Start
    unit_of_measurement: A
    device_class: current
    accuracy_decimals: 5
    update_interval: never
  - platform: template
    id: last_tail_floor
    name: "Last Session Tail Floor"
    unit_of_measurement: A
    accuracy_decimals: 5
    update_interval: never
  - platform: template
    id: last_tail_last
    name: "Last Session Final Window Mean"
    unit_of_measurement: A
    accuracy_decimals: 5
    update_interval: never
  - platform: template
    id: last_q_settle
    name: "Last Session Charge After Settle"
    unit_of_measurement: Ah
    accuracy_decimals: 5
    update_interval: never
  - platform: template
    id: last_idle_off
    name: "Last Session Idle Offset"
    unit_of_measurement: A
    accuracy_decimals: 5
    update_interval: never

  # ---- FW-12 edge pairs: all four of an edge are published in the same tick.
  #      R_edge = dV/dI is computed downstream, not here.
  - platform: template
    id: edge_on_vb
    name: "Edge ON VBUS Before"
    unit_of_measurement: V
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: edge_on_ib
    name: "Edge ON Current Before"
    unit_of_measurement: A
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: edge_on_va
    name: "Edge ON VBUS After"
    unit_of_measurement: V
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: edge_on_ia
    name: "Edge ON Current After"
    unit_of_measurement: A
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: edge_off_vb
    name: "Edge OFF VBUS Before"
    unit_of_measurement: V
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: edge_off_ib
    name: "Edge OFF Current Before"
    unit_of_measurement: A
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: edge_off_va
    name: "Edge OFF VBUS After"
    unit_of_measurement: V
    accuracy_decimals: 4
    update_interval: never
  - platform: template
    id: edge_off_ia
    name: "Edge OFF Current After"
    unit_of_measurement: A
    accuracy_decimals: 4
    update_interval: never

  # V0.4 (#6): with "Reset Reason", tells a reset from a long Wi-Fi gap.
  - platform: uptime
    name: "Uptime"             # seconds since boot, every 60 s (component defaults)

  # ---- V0.5: node health (owner, 2026-10-30), the same set as the other nodes
  - platform: wifi_signal
    name: "WiFi Signal"        # RSSI
    update_interval: 60s
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Free Heap"
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"        # the longest loop pass; the tick's cycle margin depends on it
      entity_category: diagnostic
  - platform: internal_temperature
    name: "CPU Temperature"    # node health only. FW-10 rejects it as the enclosure proxy
    entity_category: diagnostic
  - platform: template
    id: sessions_ha
    name: "Sessions Started"   # lifetime, from flash
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: flush_ms_ha
    name: "Flash Flush Time"   # blocks the tick: must stay well under ~372 ms [D: 500 - 128]
    unit_of_measurement: ms
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: state_txt
    name: "Charger State"
    update_interval: never
  - platform: template
    id: reason_txt
    name: "Fault Reason"
    update_interval: never
  - platform: template
    id: led_txt
    name: "LED Mode"              # lets HA check "LED pattern matches state" in every test
    update_interval: never
  - platform: template
    id: last_reason_txt
    name: "Last Session End"
    update_interval: never
  - platform: template
    id: last_end_time_txt
    name: "Last Session End Time"  # V0.5. A cut session: the last checkpoint's time
    device_class: timestamp        # ISO 8601 with Z. "" reads unknown in HA [M:
    update_interval: never         # esphome/sensor.py:141-142, util/dt.py:230-238, 2026.10.4]
  - platform: version              # V0.5: node health
    name: "ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info            # V0.5: node health
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
  - platform: debug              # V0.4 (#6): e.g. "power-on event", "task
    reset_reason:                # watchdog", "brownout" [M: debug_esp32.cpp:26-43,
      name: "Reset Reason"       # 2026.10.0]. Which one an AC cut gives is T9's [I]

binary_sensor:
  - platform: template
    id: start_ok_bin
    name: "Start Permitted"
  - platform: template
    id: sw_bin
    name: "Charge Switch"         # commanded state, read-only
  - platform: status              # V0.5: node health
    name: "Status"
    entity_category: diagnostic

button:
  - platform: template
    name: "Start"
    on_press:
      - lambda: 'id(req_start) = true;'
  - platform: template
    name: "Stop"
    on_press:
      - lambda: 'id(req_stop) = true;'
  - platform: template
    name: "Acknowledge"
    on_press:
      - lambda: 'id(req_ack) = true;'

interval:
  # =========================================================================
  # CONTROL TICK (CORE). The only place the switch is turned ON (FW-1).
  # 500 ms is load-bearing: FW-12's after-edge rule needs >= 270 ms per tick,
  # and the cycle margin above needs it well above ~128 ms.
  # =========================================================================
  - interval: 500ms
    then:
      - lambda: |-
          static const char *const TAG = "charger";
          enum { ST_IDLE = 0, ST_CHARGING = 1, ST_DONE = 2, ST_FAULT = 3 };
          enum { R_NONE = 0, R_DONE, R_OVERVOLTAGE, R_OVERCURRENT, R_OVERLOAD, R_TMAX,
                 R_SENSOR, R_BMS_TRIP, R_SWITCH_ON, R_STOP_USER, R_STOP_OTA, R_INTERNAL,
                 R_LOST_RESET, R_INA_RESET,     // V0.4. rec_reason is restored: append, never renumber
                 R_BMS_OPEN };                  // V0.5
          static const char *const REASON[] = {
            "none",
            "done: time at voltage reached",
            "over-voltage: VBUS above ceiling",
            "over-current: I above I_max",
            "overload: pack not pre-charged",
            "T_max reached",
            "sensor: INA228 read failed, stale, or VBUS collapsed",
            "BMS trip (or fuse / QD open)",
            "switch conducting while commanded OFF - cut AC",
            "stopped: user",
            "stopped: OTA update",
            "internal: state and switch disagree",
            "reset during a session: record incomplete (see Reset Reason)",
            "INA228 reset: configuration or CHARGE lost - cycle AC",
            "BMS open too long (or fuse / QD open): no current at the tail"};
          enum { LED_WAITING = 0, LED_READY, LED_CHARGING, LED_FINAL, LED_DONE, LED_FAULT };
          static const char *const LED_TXT[] = {
            "Waiting", "Ready to charge", "Charging", "Final minute", "Done", "Fault"};
          static const char *const ST_TXT[] = {"IDLE", "CHARGING", "DONE", "FAULT"};
          auto rtxt = [&](int r) -> const char * {
            return (r >= R_NONE && r <= R_BMS_OPEN) ? REASON[r] : "unknown";
          };

          const float V_CEIL = ${v_ceiling}f;
          const float V_START_MIN = ${v_start_min}f;
          const float V_START_MAX = ${v_start_max}f;
          const float V_HOLD = ${v_hold}f;
          const float I_MAX = ${i_max}f;
          const float I_OL = ${i_overload}f;
          const float BMS_I_FROM = ${bms_i_from}f;
          const float BMS_I_OPEN = ${bms_i_open}f;
          const uint32_t BMS_BLOCK_TICKS = ${bms_block_s}u * 2u;       // 2 ticks per second
          const uint32_t BMS_OPEN_BLOCKS = ${bms_open_max_s}u / ${bms_block_s}u;
          const float I_OFF_FLOOR = ${i_off_floor}f;
          const uint32_t T_HOLD_MS = ${t_hold_s}u * 1000u;
          const uint32_t T_MAX_MS = ${t_max_s}u * 1000u;
          const uint32_t T_OL_MS = ${t_ol_s}u * 1000u;
          const uint32_t FINAL_LEAD_MS = ${final_lead_s}u * 1000u;
          const uint32_t TAIL_SETTLE_MS = ${tail_settle_s}u * 1000u;
          const uint32_t TAIL_WINDOW_TICKS = ${tail_window_s}u * 2u;   // 2 ticks per second
          const uint32_t CKPT_TICKS = ${ckpt_s}u * 2u;

          // ---- 0. timing. dt is capped: a stalled loop never earns hold time
          //         it cannot vouch for (safe direction: the hold runs longer).
          //         T_max uses absolute time, so the cap never extends it.
          const uint32_t now = millis();
          uint32_t dt = (id(last_tick_ms) == 0u) ? 0u : (now - id(last_tick_ms));
          if (dt > 2000u) dt = 2000u;
          id(last_tick_ms) = now;
          const uint32_t tk = ++id(tick_n);

          // ---- 1. consume the cycle armed on the previous tick
          const float v = id(vbus_raw).state;
          const float i = id(ibat_raw).state;
          const bool seen = id(cyc_seen);
          id(cyc_seen) = false;
          const bool have_data = id(cyc_primed);   // false only on the first tick
          const bool fresh = have_data && seen && !id(ina).status_has_warning() &&
                             !id(ina).is_failed() && !std::isnan(v) && !std::isnan(i);
          // V0.4 (#2): read ADC_CONFIG and SHUNT_CAL back. Only the component's
          // setup() writes them [M: ina2xx_base.cpp:51-79, 2026.10.0], so after
          // the first good read they must never change: a change is the chip
          // resetting under a running ESP (power-on defaults). The reference is
          // the chip's own value, not a copy of the ina2xx_i2c block (R10); T16
          // checks once that it is 0xFB6B / 3750 [D, see that block].
          static uint32_t cfg_ref = 0u;             // 0 = not yet read (MODE 0xF: never 0)
          uint16_t adc_cfg = 0, shunt_cal = 0;
          bool cfg_read = true, cfg_ok = true;
          if (fresh) {
            cfg_read = id(ina).read_byte_16(ina2xx_base::REG_ADC_CONFIG, &adc_cfg) &&
                       id(ina).read_byte_16(ina2xx_base::REG_SHUNT_CAL, &shunt_cal);
            if (cfg_read) {
              const uint32_t cfg = ((uint32_t) adc_cfg << 16) | shunt_cal;
              if (cfg_ref == 0u) {
                cfg_ref = cfg;
                ESP_LOGI(TAG, "INA228 configuration: ADC_CONFIG 0x%04X, SHUNT_CAL %u (T16: 0xFB6B, 3750)",
                         (unsigned) adc_cfg, (unsigned) shunt_cal);
              }
              cfg_ok = (cfg == cfg_ref);
            }
          }

          int st = id(chg_state);
          const int st_at_entry = st;

          // ---- helpers. Both leave the switch OFF; only end_session writes the record.
          // V0.5: and the checkpoint (step 7b), through this one writer, so the
          // two cannot drift (R10). OTA on_begin keeps its own copy, as before.
          auto fill_record = [&]() {
            id(rec_ah) = id(session_ah_live);
            id(rec_t_at_v_s) = id(t_at_v_ms) / 1000.0f;
            id(rec_elapsed_s) = (now - id(t_start_ms)) / 1000.0f;
            id(rec_bms_v) = id(cut_v);              // FW-5: the last cut's pair, NAN if none
            id(rec_bms_i) = id(cut_i);
            id(rec_cuts) = id(bms_cuts);
            id(rec_tail_floor) = id(tail_floor);    // FW-14; NAN if settle never reached
            id(rec_tail_last) = id(tail_last);
            id(rec_q_settle_ah) = std::isnan(id(q_at_settle)) ? NAN : (id(session_ah_live) - id(q_at_settle));
            id(rec_idle_off) = id(idle_off_start);
            const ESPTime t = id(ha_time).utcnow();
            id(rec_end_epoch) = t.is_valid() ? (uint32_t) t.timestamp : 0u;   // 0 = no clock
          };
          auto publish_end_time = [&]() {
            const uint32_t e = id(rec_end_epoch);
            if (e == 0u) {
              id(last_end_time_txt).publish_state("");   // HA: unknown
              return;
            }
            ESPTime t = ESPTime::from_epoch_utc((time_t) e);
            char buf[ESPTime::STRFTIME_BUFFER_SIZE];
            t.strftime_to(std::span<char, ESPTime::STRFTIME_BUFFER_SIZE>(buf), "%Y-%m-%dT%H:%M:%SZ");
            id(last_end_time_txt).publish_state(buf);
          };
          auto end_session = [&](int reason) {
            if (id(charge_sw).state) {
              id(charge_sw).turn_off();
              id(off_edge_tick) = tk;              // FW-12 "before" = this tick's pair
              id(off_vb) = fresh ? v : NAN;
              id(off_ib) = fresh ? i : NAN;
              id(off_pending) = true;
            }
            id(rec_reason) = reason;
            // V0.4 (#1): after a reset the live values are boot values (0), not
            // the lost session's, so the record says unknown. The FW-14 fields
            // are NAN after a boot already.
            // V0.5: the record says what the last checkpoint wrote (Start cleared
            // it, so "unknown" now means cut before the first checkpoint).
            const bool lost = (reason == R_LOST_RESET);
            if (!lost) fill_record();
            id(sess_open) = false;                  // flushed with the record, below
            id(sync_due_tick) = tk + 3u;            // >= 1 s: globals store first (see globals)
            if (reason == R_DONE) st = ST_DONE;
            else if (reason == R_STOP_USER || reason == R_STOP_OTA) st = ST_IDLE;
            else st = ST_FAULT;
            id(cur_reason) = (st == ST_IDLE) ? R_NONE : reason;
            if (st == ST_FAULT)
              ESP_LOGE(TAG, "Session FAULT: %s (VBUS %.4f V, I %.4f A)", rtxt(reason), v, i);
            else
              ESP_LOGI(TAG, "Session end: %s", rtxt(reason));
            ESP_LOGI(TAG, "  record: %.5f Ah, %.0f s at voltage, %.0f s elapsed, %u BMS cuts",
                     id(rec_ah), id(rec_t_at_v_s), id(rec_elapsed_s), (unsigned) id(rec_cuts));
            id(session_ah).publish_state(id(rec_ah));
            id(t_at_v_ha).publish_state(id(rec_t_at_v_s));
            id(t_elapsed_ha).publish_state(id(rec_elapsed_s));
            id(last_reason_txt).publish_state(rtxt(id(rec_reason)));
            id(last_ah).publish_state(id(rec_ah));
            id(last_t_at_v).publish_state(id(rec_t_at_v_s));
            id(last_elapsed).publish_state(id(rec_elapsed_s));
            id(bms_pre_v).publish_state(id(rec_bms_v));
            id(bms_pre_i).publish_state(id(rec_bms_i));
            id(last_tail_floor).publish_state(id(rec_tail_floor));
            id(last_tail_last).publish_state(id(rec_tail_last));
            id(last_q_settle).publish_state(id(rec_q_settle_ah));
            id(last_idle_off).publish_state(id(rec_idle_off));
            id(last_cuts).publish_state(id(rec_cuts));
            publish_end_time();
            if (!std::isnan(id(rec_q_settle_ah))) id(q_settle_ha).publish_state(id(rec_q_settle_ah));
            ESP_LOGI(TAG, "  tail: floor %.5f A, final window %.5f A, %.5f Ah after settle, idle offset %.5f A",
                     id(rec_tail_floor), id(rec_tail_last), id(rec_q_settle_ah), id(rec_idle_off));
          };
          auto latch_fault = [&](int reason) {      // outside a session: no record
            if (id(charge_sw).state) id(charge_sw).turn_off();
            if (st == ST_FAULT && id(cur_reason) != R_NONE)
              ESP_LOGW(TAG, "  supersedes latched reason: %s", rtxt(id(cur_reason)));
            st = ST_FAULT;
            id(cur_reason) = reason;
            ESP_LOGE(TAG, "FAULT: %s (VBUS %.4f V, I %.4f A)", rtxt(reason), v, i);
          };

          // ---- 1b. V0.4 (#1): a session still open in flash at boot was cut by
          //          a reset (AC loss, the L6 timer, a watchdog, a crash) before it
          //          wrote its record. Latch FAULT and record that, instead of
          //          booting to Waiting with the previous session's record showing.
          if (tk == 1u && id(sess_open)) end_session(R_LOST_RESET);

          // ---- 2. operator requests. Consumed here, so this tick is the only
          //         writer of the switch (FW-1).
          const bool want_start = id(req_start);
          const bool want_stop = id(req_stop);
          const bool want_ack = id(req_ack);
          id(req_start) = false;
          id(req_stop) = false;
          id(req_ack) = false;
          if (want_ack) {
            if (st == ST_DONE || st == ST_FAULT) {
              ESP_LOGI(TAG, "Acknowledged %s (%s)", ST_TXT[st], rtxt(id(cur_reason)));
              st = ST_IDLE;
              id(cur_reason) = R_NONE;   // a condition that persists re-latches below, this tick
            } else {
              ESP_LOGW(TAG, "Acknowledge ignored: nothing latched (%s)", ST_TXT[st]);
            }
          }

          // ---- 3. invariant: the switch is ON exactly when the state is CHARGING.
          //         The LED shows the state, so this keeps it honest about the switch.
          if (st != ST_CHARGING && id(charge_sw).state) {
            latch_fault(R_INTERNAL);
          } else if (st == ST_CHARGING && !id(charge_sw).state) {
            end_session(R_INTERNAL);      // e.g. the LED renderer's tick watchdog opened it
          }

          // ---- 4. sensor validity (FW-4), in EVERY state (rev 0.9). In IDLE this
          //         latches FAULT too, so the LED never shows Waiting on a pack it
          //         cannot read. While charging, VBUS below v_start_min is either a
          //         failed read (published as 0, header (b)) or a collapsed bus.
          //         V0.4 (#2): so is a failed configuration read-back (step 1),
          //         and a changed configuration is FAULT "INA228 reset". Only an
          //         AC cycle clears that: the next boot's setup() rewrites it.
          const bool valid = fresh && cfg_ok && !(st == ST_CHARGING && v < V_START_MIN);
          if (have_data && !valid) {
            if (!fresh)
              ESP_LOGE(TAG, "INA228 cycle not valid: seen=%d warning=%d failed=%d V=%.4f I=%.4f",
                       (int) seen, (int) id(ina).status_has_warning(), (int) id(ina).is_failed(), v, i);
            else if (!cfg_read)
              ESP_LOGE(TAG, "INA228 configuration read-back failed (I2C)");
            else if (!cfg_ok)
              ESP_LOGE(TAG, "INA228 configuration changed: ADC_CONFIG 0x%04X, SHUNT_CAL %u (was 0x%04X, %u)",
                       (unsigned) adc_cfg, (unsigned) shunt_cal, (unsigned) (cfg_ref >> 16), (unsigned) (cfg_ref & 0xFFFFu));
            else
              ESP_LOGE(TAG, "VBUS %.4f V below %.1f V while charging", v, V_START_MIN);
            const int r = (fresh && cfg_read && !cfg_ok) ? R_INA_RESET : R_SENSOR;
            if (st == ST_CHARGING) end_session(r);
            else if (st != ST_FAULT) latch_fault(r);
          }

          // ---- 5. FW-13: current with the switch commanded OFF. Settled = two
          //         ticks after the last OFF edge (the after-edge rule, header), and
          //         at boot the switch has been OFF since reset. The firmware cannot
          //         open a shorted #2814; it announces it, and L6 ends it.
          const bool off_settled = !id(charge_sw).state && (tk - id(off_edge_tick) >= 2u);
          if (valid && off_settled && i > I_OFF_FLOOR && id(cur_reason) != R_SWITCH_ON) {
            ESP_LOGE(TAG, "FW-13: %.4f A with the switch commanded OFF", i);
            latch_fault(R_SWITCH_ON);
          }

          // ---- 5b. FW-14 idle offset (report-only). IDLE with the switch settled
          //          OFF, so the true current is 0 (FW-13's argument). EWMA with a
          //          120-tick (~60 s) time constant.
          if (st == ST_IDLE && valid && off_settled) {
            id(idle_off) = std::isnan(id(idle_off)) ? i : id(idle_off) + (i - id(idle_off)) / 120.0f;
          }

          // ---- 6. IDLE: the start gate (FW-3), on this tick's pair only.
          //         NaN cannot pass: every comparison with NaN is false.
          id(ready_flag) = (st == ST_IDLE) && valid && (v > V_START_MIN) && (v < V_START_MAX);
          bool just_started = false;
          // V0.3 (2026-10-22): Stop beats Start. V0.2 tested want_start alone, so a
          // Stop pressed on the same tick was dropped and the session started
          // [source read, R13]. Cancelling is the safe direction.
          if (want_start && want_stop) {
            ESP_LOGW(TAG, "Start cancelled: Stop pressed on the same tick");
          } else if (want_start) {
            if (st != ST_IDLE) {
              ESP_LOGW(TAG, "Start ignored: state %s", ST_TXT[st]);
            } else if (!id(ready_flag)) {
              if (!valid)
                ESP_LOGW(TAG, "Start refused: no valid INA228 reading");
              else if (!(v > V_START_MIN))
                ESP_LOGW(TAG, "Start refused: VBUS %.3f V <= %.1f V (pack absent, reversed, or below UVP)",
                         v, V_START_MIN);
              else
                ESP_LOGW(TAG, "Start refused: VBUS %.3f V >= V_start_max %.3f V (pack still resting above the gate)",
                         v, V_START_MAX);
            } else if (!id(ina).reset_energy_counters()) {
              ESP_LOGE(TAG, "Start refused: CHARGE register reset failed (I2C write)");
            } else {
              id(on_edge_tick) = tk;                // FW-12 "before" = this tick's pair
              id(on_vb) = v;
              id(on_ib) = i;
              id(on_pending) = true;
              id(t_start_ms) = now;
              id(t_at_v_ms) = 0u;
              id(t_ol_ms) = 0u;
              id(prev_v) = NAN;
              id(prev_i) = NAN;
              id(session_ah_live) = 0.0f;
              id(sess_ah_peak) = 0.0f;              // V0.4 (#2)
              id(sess_open) = true;                 // V0.4 (#1): flushed ~1.5 s from now;
              id(sync_due_tick) = tk + 3u;          //   a reset before then is not caught
              id(blk_sum) = 0.0;                    // V0.5 (O18)
              id(blk_n) = 0u;
              id(blk_t_at_v) = 0u;
              id(blk_tail_sum) = 0.0;
              id(blk_tail_n) = 0u;
              id(bms_ref_a) = INFINITY;
              id(bms_ref_b) = INFINITY;
              id(bms_low_n) = 0u;
              id(bms_cuts) = 0u;
              id(cut_v) = NAN;
              id(cut_i) = NAN;
              id(bms_cuts_ha).publish_state(0);
              // V0.5: the record now belongs to this session. Cleared here and
              // flushed with sess_open, so a cut before the first checkpoint
              // reads unknown, never the previous session's figures.
              id(rec_ah) = NAN;
              id(rec_t_at_v_s) = NAN;
              id(rec_elapsed_s) = NAN;
              id(rec_bms_v) = NAN;
              id(rec_bms_i) = NAN;
              id(rec_cuts) = 0u;
              id(rec_tail_floor) = NAN;
              id(rec_tail_last) = NAN;
              id(rec_q_settle_ah) = NAN;
              id(rec_idle_off) = NAN;
              id(rec_end_epoch) = 0u;
              id(rec_edge_on_vb) = NAN;
              id(rec_edge_on_ib) = NAN;
              id(rec_edge_on_va) = NAN;
              id(rec_edge_on_ia) = NAN;
              id(rec_edge_off_vb) = NAN;
              id(rec_edge_off_ib) = NAN;
              id(rec_edge_off_va) = NAN;
              id(rec_edge_off_ia) = NAN;
              id(rec_sessions)++;
              id(sessions_ha).publish_state(id(rec_sessions));
              id(tail_sum) = 0.0;                   // FW-14
              id(tail_n) = 0u;
              id(tail_floor) = NAN;
              id(tail_last) = NAN;
              id(q_at_settle) = NAN;
              id(idle_off_start) = id(idle_off);
              id(sess_idle_off_ha).publish_state(id(idle_off_start));
              id(tail_mean_ha).publish_state(NAN);
              id(tail_floor_ha).publish_state(NAN);
              id(q_settle_ha).publish_state(NAN);
              id(charge_sw).turn_on();
              st = ST_CHARGING;
              id(cur_reason) = R_NONE;
              just_started = true;
              ESP_LOGI(TAG, "Session START: VBUS %.4f V, I %.4f A, V_hold %.3f V, T_hold %u s",
                       v, i, V_HOLD, (unsigned) (T_HOLD_MS / 1000u));
            }
          }
          if (want_stop && !want_start && st != ST_CHARGING)
            ESP_LOGW(TAG, "Stop ignored: no session running");

          // ---- 7. CHARGING: hard stops (FW-4), BMS trip (FW-5), normal end (FW-6).
          //         Hard stops come first, so a stop that coincides with a fault
          //         keeps the fault's reason.
          if (st == ST_CHARGING && !just_started && valid) {
            const uint32_t elapsed = now - id(t_start_ms);
            const float q = id(hw_charge_ah).state;   // same cycle as v, i
            // V0.4 (#2): CHARGE only rises while charging (I >= 0 behind the
            // ideal diode, design §5), so a fall below half its session peak is
            // a cleared register: an INA228 reset the read-back (step 1) did not
            // see, or a stray accumulator reset. The record keeps the last good value.
            // R13, 2026-10-30: "only rises" ignored the INA228's own offset, -0.0986 mA
            // [M, S5]. CHARGE integrates it, so a tail under about 0.1 mA makes the
            // register FALL, and a small session on a nearly full pack can drop below
            // half its peak: FAULT "INA228 reset" on a healthy chip. Found by the V0.5
            // replay, never seen on the device. q_slack is what the offset can take
            // off CHARGE by now, x 1.25: the idle 10 s blocks reach -0.118 mA [M,
            // n=2880], 1.2 x the mean [D]. Limit: with slack about 1 mAh at 8 h [D], a
            // cleared register goes unseen in a session that peaked under about 2 mAh;
            // the read-back (step 1) still sees a chip reset.
            const float q_slack = std::isnan(id(idle_off_start)) ? 0.0f :
                                  1.25f * std::fabs(id(idle_off_start)) * (elapsed / 3600000.0f);
            const bool q_fell = !std::isnan(q) && id(sess_ah_peak) > 0.0f &&
                                q < 0.5f * id(sess_ah_peak) - q_slack;
            if (!std::isnan(q) && !q_fell) {
              id(session_ah_live) = q;
              if (q > id(sess_ah_peak)) id(sess_ah_peak) = q;
            }
            if (i > I_OL) id(t_ol_ms) += dt;          // cumulative, rev 0.9
            // ---- 7a. V0.5 (O18): the block (header: BMS OPEN). No voltage gate:
            //          a gate at V_hold would blind it to every cut below V_hold.
            const float i_net = i - (std::isnan(id(idle_off_start)) ? 0.0f : id(idle_off_start));
            id(blk_sum) += (double) i_net;
            id(blk_n)++;
            if (v >= V_HOLD) {
              id(blk_t_at_v) += dt;
              id(blk_tail_sum) += (double) i;
              id(blk_tail_n)++;
            }
            if (i_net >= 2.0f * BMS_I_OPEN) {
              id(prev_v) = v;
              id(prev_i) = i;
            }
            bool bms_trip = false, bms_open = false;
            if (id(blk_n) >= BMS_BLOCK_TICKS) {
              const float bm = (float) (id(blk_sum) / (double) id(blk_n));
              const float ref = std::max(id(bms_ref_a), id(bms_ref_b));
              if (bm < BMS_I_OPEN && ref >= 2.0f * BMS_I_OPEN) {
                id(bms_low_n)++;
                bms_trip = (ref >= BMS_I_FROM);
                if (bms_trip || id(bms_low_n) == 2u) {
                  id(bms_cuts)++;
                  id(cut_v) = id(prev_v);
                  id(cut_i) = id(prev_i);
                  id(bms_cuts_ha).publish_state(id(bms_cuts));
                  ESP_LOGW(TAG, "BMS cut %u: block mean %.6f A, last sample with current %.4f V, %.6f A",
                           (unsigned) id(bms_cuts), bm, id(cut_v), id(cut_i));
                }
                bms_open = (id(bms_low_n) >= BMS_OPEN_BLOCKS);
              } else {
                id(bms_ref_b) = std::isinf(id(bms_ref_a)) ? bm : id(bms_ref_a);
                id(bms_ref_a) = bm;
                id(bms_low_n) = 0u;
                id(t_at_v_ms) += id(blk_t_at_v);
                // ---- FW-14 tail floor: OBSERVATION ONLY. It sits before the
                //      decisions only so a session ending on this tick records
                //      this block's samples; no decision below reads tail_*.
                if (id(blk_tail_n) > 0u && id(t_at_v_ms) >= TAIL_SETTLE_MS) {
                  if (std::isnan(id(q_at_settle))) id(q_at_settle) = id(session_ah_live);
                  id(tail_sum) += id(blk_tail_sum);
                  id(tail_n) += id(blk_tail_n);
                  if (id(tail_n) >= TAIL_WINDOW_TICKS) {
                    const float m = (float) (id(tail_sum) / (double) id(tail_n));
                    id(tail_last) = m;
                    if (std::isnan(id(tail_floor)) || m < id(tail_floor)) id(tail_floor) = m;
                    id(tail_sum) = 0.0;
                    id(tail_n) = 0u;
                    id(tail_mean_ha).publish_state(m);
                    id(tail_floor_ha).publish_state(id(tail_floor));
                    ESP_LOGI(TAG, "Tail window mean %.5f A, floor %.5f A", m, id(tail_floor));
                  }
                }
              }
              id(blk_sum) = 0.0;
              id(blk_n) = 0u;
              id(blk_t_at_v) = 0u;
              id(blk_tail_sum) = 0.0;
              id(blk_tail_n) = 0u;
            }
            if (v > V_CEIL) end_session(R_OVERVOLTAGE);         // raw VBUS: no calibration in it
            else if (q_fell) end_session(R_INA_RESET);          // V0.4: i below may be mis-scaled
            else if (i > I_MAX) end_session(R_OVERCURRENT);
            else if (id(t_ol_ms) > T_OL_MS) end_session(R_OVERLOAD);
            else if (elapsed > T_MAX_MS) end_session(R_TMAX);
            else if (bms_trip) end_session(R_BMS_TRIP);
            else if (bms_open) end_session(R_BMS_OPEN);
            else {
              // R13, 2026-10-30: V0.1-V0.4 added dt here on every tick with
              // v >= V_HOLD, "current logged, never acted on (FW-6)". O21's 28 s
              // with the BMS open counted as hold time. Step 7a credits it now.
              if (id(t_at_v_ms) >= T_HOLD_MS) end_session(R_DONE);
              else if (want_stop) end_session(R_STOP_USER);
            }
            // ---- 7b. V0.5 (FW-9): checkpoint, so a cut session keeps its figures
            if (st == ST_CHARGING && ((tk - id(on_edge_tick)) % CKPT_TICKS) == 0u) {
              fill_record();
              id(sync_due_tick) = tk + 3u;          // >= 1 s: globals store first
            }
          }

          // ---- 8. FW-12 after-edge pairs, two ticks after each edge. An edge in
          //         the other direction on an EARLIER tick voids the "after" pair:
          //         this tick's pair was read after it. One on THIS tick does not:
          //         the pair was consumed before step 7 moved the switch.
          if (id(on_pending) && tk >= id(on_edge_tick) + 2u) {
            const bool ok = valid && !(id(off_edge_tick) > id(on_edge_tick) && id(off_edge_tick) < tk);
            id(edge_on_vb).publish_state(id(on_vb));
            id(edge_on_ib).publish_state(id(on_ib));
            id(edge_on_va).publish_state(ok ? v : NAN);
            id(edge_on_ia).publish_state(ok ? i : NAN);
            id(rec_edge_on_vb) = id(on_vb);         // V0.5: flash by the 60 s auto-sync
            id(rec_edge_on_ib) = id(on_ib);         //   or the first checkpoint
            id(rec_edge_on_va) = ok ? v : NAN;
            id(rec_edge_on_ia) = ok ? i : NAN;
            id(on_pending) = false;
          }
          if (id(off_pending) && tk >= id(off_edge_tick) + 2u) {
            const bool ok = valid && !(id(on_edge_tick) > id(off_edge_tick) && id(on_edge_tick) < tk);
            id(edge_off_vb).publish_state(id(off_vb));
            id(edge_off_ib).publish_state(id(off_ib));
            id(edge_off_va).publish_state(ok ? v : NAN);
            id(edge_off_ia).publish_state(ok ? i : NAN);
            id(rec_edge_off_vb) = id(off_vb);       // V0.5
            id(rec_edge_off_ib) = id(off_ib);
            id(rec_edge_off_va) = ok ? v : NAN;
            id(rec_edge_off_ia) = ok ? i : NAN;
            id(sync_due_tick) = tk + 3u;            // one flush, with the record: end + 5 ticks
            id(off_pending) = false;
          }

          // ---- 9. flush the session record to flash (see globals)
          if (id(sync_due_tick) != 0u && tk >= id(sync_due_tick)) {
            id(sync_due_tick) = 0u;
            const uint32_t fl0 = millis();          // V0.5: this stalls the tick
            const bool fl_ok = global_preferences->sync();
            const uint32_t fl_ms = millis() - fl0;
            id(flush_ms_ha).publish_state(fl_ms);
            if (fl_ok)
              ESP_LOGI(TAG, "Session record flushed to flash (%u ms)", (unsigned) fl_ms);
            else
              ESP_LOGW(TAG, "Session record flush FAILED (%u ms)", (unsigned) fl_ms);
          }

          // ---- 10. LED mode (FW-11), in precedence order
          int mode;
          if (st == ST_FAULT) mode = LED_FAULT;
          else if (st == ST_DONE) mode = LED_DONE;
          else if (st == ST_CHARGING) {
            const uint32_t rem = (id(t_at_v_ms) >= T_HOLD_MS) ? 0u : (T_HOLD_MS - id(t_at_v_ms));
            mode = (rem <= FINAL_LEAD_MS) ? LED_FINAL : LED_CHARGING;
          } else {
            mode = id(ready_flag) ? LED_READY : LED_WAITING;
          }
          if (mode != id(led_mode)) {
            id(led_mode) = mode;
            id(led_t0) = now;
          }
          id(chg_state) = st;

          // ---- 11. publish (changes now; telemetry at 1 Hz)
          static int pub_st = -1, pub_reason = -1, pub_led = -1, pub_ready = -1, pub_sw = -1;
          if (st != pub_st) { id(state_txt).publish_state(ST_TXT[st]); pub_st = st; }
          if (id(cur_reason) != pub_reason) {
            id(reason_txt).publish_state(rtxt(id(cur_reason)));
            pub_reason = id(cur_reason);
          }
          if (mode != pub_led) { id(led_txt).publish_state(LED_TXT[mode]); pub_led = mode; }
          if ((int) id(ready_flag) != pub_ready) {
            id(start_ok_bin).publish_state(id(ready_flag));
            pub_ready = id(ready_flag);
          }
          if ((int) id(charge_sw).state != pub_sw) {
            id(sw_bin).publish_state(id(charge_sw).state);
            pub_sw = id(charge_sw).state;
          }
          if (tk == 1u) {   // the restored record, once per boot
            id(last_reason_txt).publish_state(rtxt(id(rec_reason)));
            id(last_ah).publish_state(id(rec_ah));
            id(last_t_at_v).publish_state(id(rec_t_at_v_s));
            id(last_elapsed).publish_state(id(rec_elapsed_s));
            id(bms_pre_v).publish_state(id(rec_bms_v));
            id(bms_pre_i).publish_state(id(rec_bms_i));
            id(last_tail_floor).publish_state(id(rec_tail_floor));
            id(last_tail_last).publish_state(id(rec_tail_last));
            id(last_q_settle).publish_state(id(rec_q_settle_ah));
            id(last_idle_off).publish_state(id(rec_idle_off));
            // V0.5: the Session card and the edge pairs, which HA otherwise shows
            // unknown after an unplug [M, 2026-10-29 07:44:18]. No flash write.
            const float rem_s = (T_HOLD_MS / 1000.0f) - id(rec_t_at_v_s);
            id(last_cuts).publish_state(id(rec_cuts));
            publish_end_time();
            id(sessions_ha).publish_state(id(rec_sessions));
            id(bms_cuts_ha).publish_state(id(rec_cuts));
            id(session_ah).publish_state(id(rec_ah));
            id(t_at_v_ha).publish_state(id(rec_t_at_v_s));
            id(t_remain_ha).publish_state(std::isnan(rem_s) ? NAN : (rem_s < 0.0f ? 0.0f : rem_s));
            id(t_elapsed_ha).publish_state(id(rec_elapsed_s));
            id(q_settle_ha).publish_state(id(rec_q_settle_ah));
            id(tail_mean_ha).publish_state(id(rec_tail_last));
            id(tail_floor_ha).publish_state(id(rec_tail_floor));
            id(sess_idle_off_ha).publish_state(id(rec_idle_off));
            id(edge_on_vb).publish_state(id(rec_edge_on_vb));
            id(edge_on_ib).publish_state(id(rec_edge_on_ib));
            id(edge_on_va).publish_state(id(rec_edge_on_va));
            id(edge_on_ia).publish_state(id(rec_edge_on_ia));
            id(edge_off_vb).publish_state(id(rec_edge_off_vb));
            id(edge_off_ib).publish_state(id(rec_edge_off_ib));
            id(edge_off_va).publish_state(id(rec_edge_off_va));
            id(edge_off_ia).publish_state(id(rec_edge_off_ia));
          }
          if ((tk & 1u) == 0u) {
            id(vbus_ha).publish_state(valid ? v : NAN);
            id(ibat_ha).publish_state(valid ? i : NAN);
            id(pbat_ha).publish_state(valid ? v * i : NAN);
            id(die_t_ha).publish_state(valid ? id(die_t_raw).state : NAN);
            if (st == ST_CHARGING) {
              id(session_ah).publish_state(id(session_ah_live));
              id(t_at_v_ha).publish_state(id(t_at_v_ms) / 1000.0f);
              const uint32_t rem = (id(t_at_v_ms) >= T_HOLD_MS) ? 0u : (T_HOLD_MS - id(t_at_v_ms));
              id(t_remain_ha).publish_state(rem / 1000.0f);
              id(t_elapsed_ha).publish_state((now - id(t_start_ms)) / 1000.0f);
              if (!std::isnan(id(q_at_settle)))
                id(q_settle_ha).publish_state(id(session_ah_live) - id(q_at_settle));
            } else if (st == ST_IDLE && (tk % 20u) == 0u) {
              id(idle_off_ha).publish_state(id(idle_off));
            }
          }
          if (st != st_at_entry)
            ESP_LOGI(TAG, "State %s -> %s", ST_TXT[st_at_entry], ST_TXT[st]);

          // ---- 12. arm the next INA228 cycle; the next tick consumes it
          id(cyc_primed) = true;
          id(ina).update();

  # =========================================================================
  # LED RENDERER (FW-11). Displays led_mode; phase from millis(), so a late
  # pass never stretches a pattern. Tick watchdog: if the control tick has not
  # run for > 2 s WHILE this renderer has kept running, open the switch and
  # show Fault (the tick then ends the session as FAULT "internal" through its
  # invariant, step 3, if it ever runs again). A stall of the whole loop stops
  # both intervals and is not this case: when the loop resumes, the renderer's
  # own gap is long too, so it does not trip [I: the scheduler runs both
  # overdue intervals before the renderer's next pass; falsifier: FAULT
  # "internal" in T4's silent run]. A hung loop is L3's (§8).
  # =========================================================================
  - interval: 25ms
    then:
      - lambda: |-
          static int last_on = -1;
          static uint32_t last_render = 0;
          const uint32_t now = millis();
          const bool renderer_alive = (last_render != 0u) && (now - last_render) < 500u;
          last_render = now;
          int mode = id(led_mode);
          if (renderer_alive && id(last_tick_ms) != 0u && (now - id(last_tick_ms)) > 2000u) {
            if (id(charge_sw).state) {
              id(charge_sw).turn_off();
              ESP_LOGE("charger", "Control tick stalled > 2 s: switch OFF");
            }
            mode = 5;   // Fault pattern
          }
          const uint32_t ph = now - id(led_t0);
          bool on;
          switch (mode) {
            case 0: on = (ph % 3000u) >= 100u; break;                       // Waiting (V0.5: inverted)
            case 1: on = (ph % 3000u) < 1000u; break;                       // Ready to charge
            case 2: on = (ph % 1000u) < 500u; break;                        // Charging
            case 3: { const uint32_t p = ph % 1000u;                        // Final minute
                      on = (p < 150u) || (p >= 300u && p < 450u); break; }
            case 4: { const uint32_t p = ph % 3000u;                        // Done (V0.5: inverted)
                      on = !((p < 100u) || (p >= 300u && p < 400u)); break; }
            case 5: on = (ph % 250u) < 125u; break;                         // Fault, 4 Hz
            default: on = false; break;
          }
          if ((int) on != last_on) {
            last_on = on;
            if (on) id(status_led).turn_on();
            else id(status_led).turn_off();
          }

  # =========================================================================
  # IDLE-only recovery reboot (FW-8): reboot_timeout is 0s on api and wifi,
  # and ESPHome notes a full reboot is sometimes needed to recover Wi-Fi.
  # Never in CHARGING, and never with a latch showing (DONE / FAULT).
  # =========================================================================
  - interval: 30s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: 'id(last_api_ms) = millis();'
      - lambda: |-
          if (id(chg_state) == 0 && (millis() - id(last_api_ms)) > 15u * 60u * 1000u) {
            ESP_LOGW("charger", "No API client for 15 min while IDLE: rebooting to recover Wi-Fi");
            App.safe_reboot();
          }
