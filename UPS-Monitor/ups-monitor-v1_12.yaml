#           Power budget (corrected in design doc v3 — see note):
#             Blended 99.98% A / 0.02% B, 83 µA sleep, 0.41 Ah:
#             I_avg = 1.151 mA → 14.8 days — 48% margin above 10-day target.
#             (The 95/5 split / 12.8-day figure originally cited here was an
